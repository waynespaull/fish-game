<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Southern African Fish Quiz</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fish Quiz">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    #game-container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 800;
    }
    .badge {
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #334155;
    }
    .img-box {
      width: 100%;
      height: 220px;
      background-color: #cbd5e1;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-placeholder {
      text-align: center;
      color: #475569;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px;
    }
    .img-placeholder .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 8px;
    }
    .photo-credit {
      font-size: 0.85rem;
      text-align: center;
      color: #64748b;
    }
    .photo-credit a {
      color: #0284c7;
    }
    .question-prompt {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice-btn {
      min-height: 64px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f172a;
      background-color: #ffffff;
      border: 3px solid #475569;
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      cursor: pointer;
    }
    .choice-btn.correct {
      background-color: #bbf7d0 !important;
      border-color: #15803d !important;
      color: #14532d !important;
    }
    .choice-btn.wrong {
      background-color: #fecaca !important;
      border-color: #b91c1c !important;
      color: #7f1d1d !important;
    }
    #feedback {
      min-height: 32px;
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
    }
    #next-btn {
      display: none;
      min-height: 65px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }
    #app-footer {
      font-size: 0.8rem;
      text-align: center;
      color: #94a3b8;
      padding-top: 8px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <span id="progress-text">Fish 1 of 6</span>
    <span id="habitat-badge" class="badge">Inland</span>
  </div>

  <div class="img-box" id="img-box">
    <img id="fish-img" src="" alt="A fish for you to identify" style="display:none;">
  </div>
  <div id="photo-credit" class="photo-credit"></div>

  <div class="question-prompt">What fish is this?</div>

  <div class="options-grid" id="options-container"></div>

  <div id="feedback"></div>

  <button id="next-btn" onclick="nextCard()">Next Fish →</button>

  <div id="app-footer">Fish photos © their respective Wikimedia Commons photographers, used under Creative Commons licenses. Tap a photo credit link above for details.</div>
</div>

<script>
  // Each card lists a preferred local image (fast, hosted in this repo) and an
  // optional fallback + credit link to the original Wikimedia Commons photo.
  // If you upload a matching file into /images (see README), the local copy
  // is used automatically — no code change needed.
  const deck = [
    {
      name: "Tigerfish",
      habitat: "🏞️ Inland Freshwater",
      image: "images/tigerfish.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Hydrocynus_vittatus_15808090.jpg?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Hydrocynus_vittatus_15808090.jpg"
    },
    {
      name: "Galjoen",
      habitat: "🌊 Ocean Coastal",
      image: "images/galjoen.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Galjoen_(Dichistius_capensis).jpg?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Galjoen_(Dichistius_capensis).jpg"
    },
    {
      name: "Snoek",
      habitat: "🌊 Ocean Pelagic",
      image: "images/snoek.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Thyrsites_atun,_Barracouta_or_snake_Mackerel.jpg?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Thyrsites_atun,_Barracouta_or_snake_Mackerel.jpg"
    },
    {
      name: "Sharptooth Catfish",
      habitat: "🏞️ Inland Freshwater",
      image: "images/catfish.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Clarias_gariepinus,_African_sharptooth_catfish.jpg?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Clarias_gariepinus,_African_sharptooth_catfish.jpg"
    },
    {
      name: "Red Roman",
      habitat: "🌊 Ocean Reef",
      image: "images/roman.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Roman_Chrysoblephus_laticeps_DSC02776.JPG?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Roman_Chrysoblephus_laticeps_DSC02776.JPG"
    },
    {
      name: "Spotted Grunter",
      habitat: "🌊 Estuary & Ocean",
      image: "images/grunter.jpg",
      fallback: "https://commons.wikimedia.org/wiki/Special:FilePath/Pomadasys_commersonnii,_Breede_river_mouth.jpg?width=600",
      credit: "https://commons.wikimedia.org/wiki/File:Pomadasys_commersonnii,_Breede_river_mouth.jpg"
    }
  ];

  // More species, ready to go: once you've uploaded a photo to /images with
  // the filename listed here, cut the entry from this list and paste it into
  // `deck` above (see README "Adding more fish" for the full checklist).
  //
  // const pendingSpecies = [
  //   { name: "Cape Yellowtail",        habitat: "🌊 Ocean Pelagic",         image: "images/yellowtail.jpg" },
  //   { name: "Kob (Kabeljou)",         habitat: "🌊 Estuary & Ocean",       image: "images/kob.jpg" },
  //   { name: "White Steenbras",        habitat: "🌊 Ocean Coastal",         image: "images/steenbras.jpg" },
  //   { name: "Garrick (Leervis)",      habitat: "🌊 Estuary & Ocean",       image: "images/garrick.jpg" },
  //   { name: "Blacktail",              habitat: "🌊 Ocean Coastal",         image: "images/blacktail.jpg" },
  //   { name: "Geelbek (Cape Salmon)",  habitat: "🌊 Ocean Coastal",         image: "images/geelbek.jpg" },
  //   { name: "Largemouth Yellowfish",  habitat: "🏞️ Inland Freshwater",    image: "images/yellowfish.jpg" },
  //   { name: "Mozambique Tilapia",     habitat: "🏞️ Inland Freshwater",    image: "images/tilapia.jpg" },
  //   { name: "Vundu Catfish",          habitat: "🏞️ Inland Freshwater",    image: "images/vundu.jpg" },
  //   { name: "Kingklip",               habitat: "🌊 Ocean Deep-water",      image: "images/kingklip.jpg" },
  //   { name: "Cape Hake",              habitat: "🌊 Ocean Deep-water",      image: "images/hake.jpg" },
  //   { name: "Shad (Elf)",             habitat: "🌊 Ocean Coastal",         image: "images/shad.jpg" },
  //   { name: "Cape Stumpnose",         habitat: "🌊 Estuary & Ocean",       image: "images/stumpnose.jpg" },
  //   { name: "Longfin Eel",            habitat: "🏞️ Inland Freshwater / Estuary", image: "images/eel.jpg" }
  // ];

  let currentIndex = 0;
  let score = 0;
  const preloadedImages = []; // keep references so the browser can't garbage-collect them early

  function shuffle(array) {
    const copy = array.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Builds this card's 4 choices from the correct name plus 3 random distractors
  // pulled from the rest of the deck, shuffled into a new order each time.
  function buildOptions(card) {
    const others = deck.filter(c => c.name !== card.name).map(c => c.name);
    const distractors = shuffle(others).slice(0, 3);
    return shuffle([card.name, ...distractors]);
  }

  function preloadImages() {
    deck.forEach(card => {
      const img = new Image();
      img.src = card.image;
      preloadedImages.push(img);
    });
  }

  // Tries the local photo first, falls back to the Commons hotlink if that's
  // missing, and finally shows a plain placeholder rather than a broken-image icon.
  function setCardImage(card) {
    const imgEl = document.getElementById("fish-img");
    const boxEl = document.getElementById("img-box");
    const creditEl = document.getElementById("photo-credit");
    const existingPlaceholder = boxEl.querySelector(".img-placeholder");
    if (existingPlaceholder) existingPlaceholder.remove();

    creditEl.innerHTML = card.credit
      ? `Photo: <a href="${card.credit}" target="_blank" rel="noopener">Wikimedia Commons</a> — tap for photographer & license`
      : "";

    let stage = "local";
    imgEl.style.display = "block";
    imgEl.onerror = () => {
      if (stage === "local" && card.fallback) {
        stage = "fallback";
        imgEl.src = card.fallback;
      } else {
        imgEl.style.display = "none";
        const placeholder = document.createElement("div");
        placeholder.className = "img-placeholder";
        placeholder.innerHTML = `<span class="icon">📷</span>Photo coming soon`;
        boxEl.appendChild(placeholder);
      }
    };
    imgEl.src = card.image;
  }

  function loadCard() {
    const card = deck[currentIndex];
    document.getElementById("progress-text").innerText = `Fish ${currentIndex + 1} of ${deck.length}`;
    document.getElementById("habitat-badge").innerText = card.habitat;
    setCardImage(card);
    document.getElementById("feedback").innerText = "";
    document.getElementById("next-btn").style.display = "none";

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    buildOptions(card).forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerText = opt;
      btn.onclick = () => selectAnswer(btn, opt, card.name);
      container.appendChild(btn);
    });
  }

  function selectAnswer(selectedBtn, chosenName, correctName) {
    const buttons = document.querySelectorAll(".choice-btn");
    buttons.forEach(btn => btn.disabled = true);

    const feedback = document.getElementById("feedback");

    if (chosenName === correctName) {
      selectedBtn.classList.add("correct");
      feedback.innerText = "✓ Correct!";
      feedback.style.color = "#15803d";
      score++;
      if (navigator.vibrate) navigator.vibrate(80);
    } else {
      selectedBtn.classList.add("wrong");
      feedback.innerText = `✕ That is a ${correctName}`;
      feedback.style.color = "#b91c1c";
      buttons.forEach(btn => {
        if (btn.innerText === correctName) btn.classList.add("correct");
      });
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    }

    const nextBtn = document.getElementById("next-btn");
    nextBtn.style.display = "block";
    if (currentIndex === deck.length - 1) {
      nextBtn.innerText = "See Results →";
    }
  }

  function nextCard() {
    currentIndex++;
    if (currentIndex < deck.length) {
      loadCard();
    } else {
      showSummary();
    }
  }

  function showSummary() {
    const container = document.getElementById("game-container");
    container.innerHTML = `
      <div style="text-align: center; padding: 30px 10px;">
        <h1 style="font-size: 2.2rem; margin-bottom: 20px;">Well Done!</h1>
        <p style="font-size: 1.6rem; margin-bottom: 30px; font-weight: bold;">
          Score: ${score} out of ${deck.length}
        </p>
        <button onclick="location.reload()" class="choice-btn" style="width: 100%; background: #0284c7; color: white; border: none;">
          Play Again ↺
        </button>
      </div>
    `;
  }

  preloadImages();
  loadCard();
</script>
</body>
</html>
